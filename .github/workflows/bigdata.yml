name: Big Data - Ingesta y Limpieza (CoinGecko)

# Se ejecuta al hacer push a main, manualmente desde la pestaña Actions,
# y automáticamente todos los días a las 09:00 UTC.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write

jobs:
  ingest_and_clean:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias (desde setup.py)
        run: pip install .

      # ---------- EA1: Ingesta ----------
      - name: Ejecutar la ingesta (EA1)
        run: python src/ingestion.py

      - name: Verificar artefactos de ingesta (EA1)
        run: |
          test -f src/db/ingestion.db
          test -f src/xlsx/ingestion.xlsx
          test -f src/static/auditoria/ingestion.txt
          echo "Los 3 artefactos de ingesta se generaron correctamente."

      # ---------- EA2: Preprocesamiento y limpieza ----------
      # Nota: cleaning.py no vuelve a llamar al API; lee lo que quedó
      # guardado en ingestion.db, que funciona como almacenamiento
      # en la nube simulado, tal como pide el enunciado de EA2.
      - name: Ejecutar la limpieza de datos (EA2)
        run: python src/cleaning.py

      # ---------- EA3: Enriquecimiento ----------
      - name: Ejecutar enriquecimiento de datos (EA3)
        run: python src/enrichement.py

      - name: Verificar que los artefactos de enriquecimiento existen
        run: |
          test -f src/xlsx/enriched_data.xlsx || (echo "Falta enriched_data.xlsx" && exit 1)
          test -f src/static/auditoria/enriched_report.txt || (echo "Falta enriched_report.txt" && exit 1)
          echo "Artefactos de enriquecimiento verificados."

      - name: Mostrar el reporte de auditoría del enriquecimiento en el log
        run: cat src/static/auditoria/enriched_report.txt

      # ---------- Verificar artefactos de limpieza ----------
      - name: Verificar artefactos de limpieza (EA2)
        run: |
          test -f src/xlsx/cleaned_data.xlsx
          test -f src/static/auditoria/cleaning_report.txt
          echo "Los artefactos de limpieza se generaron correctamente."
          echo "--- cleaning_report.txt ---"
          cat src/static/auditoria/cleaning_report.txt

      # ---------- Subir evidencias como artefactos ----------
      - name: Subir artefactos del workflow
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-bigdata-${{ github.run_id }}
          path: |
            src/db/ingestion.db
            src/xlsx/ingestion.xlsx
            src/xlsx/cleaned_data.xlsx
            src/xlsx/enriched_data.xlsx
            src/static/auditoria/ingestion.txt
            src/static/auditoria/cleaning_report.txt
            src/static/auditoria/enriched_report.txt

      # ---------- Commitear evidencias actualizadas ----------
      # El [skip ci] evita que este commit vuelva a ejecutar el workflow.
      - name: Commitear evidencias actualizadas al repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualiza evidencias de ingesta, limpieza y enriquecimiento (run ${{ github.run_id }}) [skip ci]"
          file_pattern: "src/db/ingestion.db src/xlsx/ingestion.xlsx src/xlsx/cleaned_data.xlsx src/xlsx/enriched_data.xlsx src/static/auditoria/ingestion.txt src/static/auditoria/cleaning_report.txt src/static/auditoria/enriched_report.txt"
